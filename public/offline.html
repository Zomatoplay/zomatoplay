<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Offline · Zomato Play</title>
    <!--
      The service worker's navigation fallback. Deliberately static and
      data-free: it states that nothing can be shown, and never shows a
      remembered balance as if it were current.
    -->
    <style>
      :root { color-scheme: light dark; --bg: #fcfcfd; --fg: #1d1f24; --muted: #6b6f78; --brand: #46887a; --card: #ffffff; --border: #e6e7ea; }
      @media (prefers-color-scheme: dark) { :root { --bg: #101113; --fg: #f3f4f6; --muted: #9ca0a8; --brand: #62a597; --card: #17181b; --border: #2a2c31; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; text-align: center; }
      h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
      button { min-height: 44px; width: 100%; border: 0; border-radius: 12px; background: var(--brand); color: #fbfcfd; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>The app needs a connection to show your balance and activity. Nothing is shown from memory, so what you see is always current.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
